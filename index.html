<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ea580c">
  <meta name="description" content="摆摊记账：商品、进货、库存、流水、利润，数据只保存在本机">
  <title>摆摊记账</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-title" id="topbar-title">账单</div>
      <button class="topbar-action" id="topbar-lock" aria-label="锁定">锁定</button>
    </header>
    <main>
      <section id="view-home" class="view"></section>
      <section id="view-products" class="view"></section>
      <section id="view-wallet" class="view"></section>
      <section id="view-stats" class="view"></section>
      <section id="view-settings" class="view"></section>
    </main>
    <nav class="tabbar">
      <div class="tabbar-inner">
        <button class="tab active" data-tab="home">账单</button>
        <button class="tab" data-tab="products">商品</button>
        <button class="tab" data-tab="wallet">钱包</button>
        <button class="tab" data-tab="stats">统计</button>
        <button class="tab" data-tab="settings">设置</button>
      </div>
    </nav>
  </div>

  <div id="modal-root" class="modal-root hidden"></div>
  <div id="pin-root" class="pin-root hidden"></div>

  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
